name: Sync Service Worker Manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'
      - '.github/**'
      - 'meta/tests/**'
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: write

jobs:
  update-sw:
    name: "Auto-sync sw.js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Regenerate Service Worker Manifest
        run: node meta/scripts/generate-sw-manifest.js

      - name: Commit and push if sw.js changed
        run: |
          if ! git diff --quiet sw.js; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "chore(sw): auto-update cache version and assets manifest [skip ci]"
            git push
          else
            echo "sw.js is already up to date."
          fi
