name: Sync Service Worker Manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'sw.js'
      - '.github/**'
      - 'meta/tests/**'
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'

permissions:
  contents: write

jobs:
  update-sw:
    name: "Auto-sync sw.js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20

      - name: Regenerate Service Worker Manifest
        run: node meta/scripts/generate-sw-manifest.js

      - name: Commit and push if sw.js changed
        run: |
          if ! git diff --quiet sw.js; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "chore(sw): auto-update cache version and assets manifest [skip ci]"
            git push
          else
            echo "sw.js is already up to date."
          fi
